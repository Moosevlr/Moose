<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102c4c" />
    <meta name="description" content="JCB ENGENHARIA Ensino Técnico. Cursos online e capacitações para fiscalização de obras de pavimentação, asfaltos e controle tecnológico." />
    <title>JCB ENGENHARIA · Ensino Técnico</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <!-- Netlify detects this schema in the built HTML; the visible form is rendered by the app. -->
    <form id="interest-form-blueprint" name="interesse" method="POST" action="/obrigado" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="interesse" />
      <input name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input name="course" />
      <textarea name="message"></textarea>
      <input type="checkbox" name="consent" value="true" />
      <input name="website" />
    </form>
    <div id="app"></div>
    <noscript>Ative o JavaScript para navegar no catálogo e consultar o registro institucional. Contato: jbeckmancordeiro@gmail.com.</noscript>
  </body>
</html>
